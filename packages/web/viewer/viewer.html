<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HAR Texture Viewer</title>
  <link rel="stylesheet" href="vendor/spine-player-3.8.css" />
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --border: #2a2f3d;
      --text: #e8eaef;
      --muted: #8b92a8;
      --accent: #6c9eff;
      --accent2: #a78bfa;
      --ok: #4ade80;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }
    h1 { margin: 0 0 6px; font-size: 1.25rem; font-weight: 600; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      align-items: center;
    }
    input[type="search"], select {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
    }
    input[type="search"] { flex: 1; min-width: 200px; }
    .stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .stats strong { color: var(--text); }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .tab {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .tab:hover { color: var(--text); border-color: var(--accent); }
    .tab.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(108, 158, 255, 0.12);
    }
    .tab.missing { opacity: 0.45; cursor: not-allowed; }
    .tabs-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    .tabs-row .tabs { margin-top: 0; }
    .tab-add {
      border-style: dashed;
      border-color: var(--accent2);
      color: var(--accent2);
      background: transparent;
    }
    .tab-add:hover { background: rgba(167, 139, 250, 0.12); color: var(--text); }
    .tab-add.busy { opacity: 0.6; cursor: progress; pointer-events: none; }
    .upload-hint { font-size: 0.8rem; color: var(--muted); }
    .upload-hint.error { color: #f87171; }
    .upload-hint.ok { color: var(--ok); }
    #drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 17, 23, 0.86);
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    #drop-overlay.show { display: flex; }
    #drop-overlay .box {
      border: 2px dashed var(--accent2);
      border-radius: 16px;
      padding: 48px 72px;
      font-size: 1.3rem;
      color: var(--text);
      background: rgba(167, 139, 250, 0.08);
    }
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }
    #grid-wrap {
      flex: 1;
      min-width: 0;
      padding: 16px;
      overflow-y: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover, .card.active {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .thumb-wrap {
      aspect-ratio: 1;
      background: #12151c;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .thumb-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: auto;
    }
    .thumb-wrap .placeholder {
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
      padding: 8px;
    }
    .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.65);
      color: var(--accent);
      text-transform: uppercase;
    }
    .badge-type {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.72);
      text-transform: uppercase;
    }
    .badge.spine { color: #a78bfa; }
    .badge.seq { color: #4ade80; }
    .badge.static { color: var(--muted); }
    .card-body { padding: 8px 10px; }
    .card-body .name {
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .card-body .sub {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 2px;
    }
    #detail {
      width: 360px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      background: var(--panel);
      padding: 16px;
      overflow-y: auto;
      display: none;
    }
    #detail.open { display: block; }
    #detail h2 {
      font-size: 0.95rem;
      margin: 0 0 12px;
      word-break: break-all;
    }
    #detail .preview {
      background: #12151c;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #detail .preview img {
      max-width: 100%;
      max-height: 320px;
      object-fit: contain;
    }
    .kv { font-size: 0.82rem; margin-bottom: 8px; }
    .kv dt { color: var(--muted); margin-bottom: 2px; }
    .kv dd { margin: 0; word-break: break-all; }
    .kv dd a { color: var(--accent); }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .mode-tabs { display: flex; gap: 8px; margin-top: 10px; }
    .mode-tab {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .mode-tab.active { color: var(--text); border-color: var(--accent2); background: rgba(167,139,250,0.12); }
    .mode-tab:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    #anim-wrap, #font-wrap {
      flex: 1;
      min-width: 0;
      display: none;
      overflow: hidden;
    }
    #anim-wrap.open, #font-wrap.open { display: flex; }
    #anim-list, #font-list {
      width: 300px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
    }
    #font-stage {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      gap: 14px;
    }
    .font-panel {
      background: #12151c;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 14px;
      flex-shrink: 0;
    }
    .font-panel h3 { margin: 0 0 10px; font-size: 0.82rem; color: var(--muted); font-weight: 600; }
    #font-sample-canvas { max-width: 100%; image-rendering: pixelated; }
    #font-atlas-img {
      max-width: 100%;
      max-height: 420px;
      image-rendering: pixelated;
      background:
        conic-gradient(#20242e 0 25%, #181c24 0 50%, #20242e 0 75%, #181c24 0) 0 0 / 24px 24px;
      border-radius: 6px;
    }
    #font-sample-input {
      width: min(420px, 100%); background: #10131a; color: var(--fg);
      border: 1px solid #2a3140; border-radius: 6px; padding: 6px 8px; margin-bottom: 10px;
    }
    .anim-item {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      background: var(--panel);
    }
    .anim-item:hover, .anim-item.active { border-color: var(--accent2); }
    .anim-item .title { font-size: 0.85rem; font-weight: 600; }
    .anim-item .sub { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
    #anim-stage {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
    }
    #anim-canvas-wrap {
      background: #12151c;
      border-radius: 10px;
      border: 1px solid var(--border);
      min-height: 320px;
      flex-shrink: 0; /* don't let the flex column squash the player */
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    #anim-canvas-2d { max-width: 100%; max-height: 420px; image-rendering: auto; }
    #anim-canvas-spine { width: min(720px, 100%); height: 440px; display: block; }
    #anim-player { width: min(760px, 100%); height: 480px; display: none; }
    #anim-player .spine-player { width: 100%; height: 100%; }
    #anim-player-37 { width: min(760px, 100%); height: 480px; display: none; border: 0; }
    .anim-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 12px 0;
    }
    .anim-controls button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }
    .anim-controls button:hover { border-color: var(--accent); }
    .anim-controls label { font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .anim-controls input[type="number"] {
      width: 56px; background: #10131a; color: var(--fg);
      border: 1px solid #2a3140; border-radius: 6px; padding: 4px 6px;
    }
    .anim-controls button:disabled { opacity: 0.45; cursor: not-allowed; }
    #bake-progress {
      display: none; align-items: center; gap: 10px; margin-top: 8px;
      font-size: 0.8rem; color: var(--muted); width: min(760px, 100%);
    }
    #bake-progress .bar {
      flex: 1; height: 8px; background: #242a36; border-radius: 4px; overflow: hidden;
    }
    #bake-progress .fill {
      height: 100%; width: 0; background: var(--accent, #4f8ff7); transition: width 0.1s linear;
    }
    #bake-progress .txt { white-space: nowrap; }
    .anim-status { font-size: 0.82rem; color: var(--muted); margin-left: auto; }
    .btn-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--accent);
      font-size: 0.82rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    @media (max-width: 900px) {
      html, body { overflow: auto; height: auto; }
      body { display: block; }
      main { flex-direction: column; overflow: visible; }
      #grid-wrap { overflow: visible; }
      #detail { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">HAR Texture Viewer</h1>
    <div class="meta" id="subtitle"></div>
    <div class="tabs-row">
      <div class="tabs" id="tabs"></div>
      <button type="button" class="tab tab-add" id="add-har-btn" title="上传一个新的 HAR（自动识别引擎）">＋ 新 HAR</button>
      <span class="upload-hint" id="upload-hint"></span>
      <input type="file" id="har-file-input" accept=".har,application/json" style="display:none" />
    </div>
    <div class="mode-tabs">
      <button type="button" class="mode-tab active" data-mode="textures">纹理浏览</button>
      <button type="button" class="mode-tab" data-mode="animations" id="mode-anim-btn">动画预览</button>
      <button type="button" class="mode-tab" data-mode="fonts" id="mode-font-btn">位图字体</button>
    </div>
    <div class="toolbar" id="toolbar-textures">
      <input type="search" id="search" placeholder="搜索文件名 / 路径…" />
      <select id="type-filter"><option value="">全部类型</option></select>
      <select id="cat-filter"><option value="">全部分类</option></select>
      <select id="ext-filter"><option value="">全部格式</option></select>
      <select id="sort">
        <option value="size-desc">体积 ↓</option>
        <option value="size-asc">体积 ↑</option>
        <option value="name-asc">名称 A-Z</option>
        <option value="pixels-desc">像素面积 ↓</option>
      </select>
    </div>
    <div class="toolbar" id="toolbar-anim" style="display:none">
      <input type="search" id="anim-search" placeholder="搜索 Spine / 序列帧…" />
      <select id="anim-type-filter"><option value="">全部</option><option value="spine">Spine</option><option value="spine-sequence">Spine 序列帧</option><option value="sprite-sequence">Atlas 序列帧</option></select>
    </div>
    <div class="toolbar" id="toolbar-font" style="display:none">
      <input type="search" id="font-search" placeholder="搜索字体名…" />
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main>
    <div id="grid-wrap">
      <div class="grid" id="grid"></div>
    </div>
    <div id="anim-wrap">
      <div id="anim-list"></div>
      <div id="anim-stage">
        <div id="anim-canvas-wrap">
          <div id="anim-player"></div>
          <iframe id="anim-player-37" title="Spine 3.7 Player"></iframe>
          <canvas id="anim-canvas-spine" style="display:none"></canvas>
          <canvas id="anim-canvas-2d"></canvas>
        </div>
        <div class="anim-controls">
          <button type="button" id="anim-play">▶ 播放</button>
          <button type="button" id="anim-pause">⏸ 暂停</button>
          <label>动画 <select id="anim-clip"></select></label>
          <label>缩放
            <select id="anim-zoom">
              <option value="fit">适配</option>
              <option value="1">1:1 原始</option>
              <option value="0.5">0.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <label>序列组 <select id="anim-seq"></select></label>
          <label>FPS <input type="range" id="anim-fps" min="4" max="30" value="12" /> <span id="anim-fps-val">12</span></label>
          <span id="anim-status" class="anim-status"></span>
        </div>
        <div class="anim-controls">
          <button type="button" id="anim-bake-one" disabled>⬇ 当前动画转帧</button>
          <button type="button" id="anim-bake-all" disabled>⬇ 当前Spine全部动画转帧</button>
          <button type="button" id="anim-bake-tab" disabled>⬇ 全部Spine转帧</button>
          <label>导出 FPS <input type="number" id="bake-fps" min="1" max="60" value="30" /></label>
          <label>缩放
            <select id="bake-scale">
              <option value="1">1:1 原始</option>
              <option value="0.5">0.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
        </div>
        <div class="anim-controls">
          <button type="button" id="anim-dl-one" disabled>⬇ 当前Spine资源包</button>
          <button type="button" id="anim-dl-all" disabled>⬇ 全部Spine资源包</button>
          <span style="font-size:0.78rem;color:var(--muted)">资源包 = skeleton.json + .atlas + 贴图（Spine 原始格式）</span>
        </div>
        <div id="bake-progress"><div class="bar"><div class="fill" id="bake-fill"></div></div><span class="txt" id="bake-text"></span></div>
        <dl class="kv" id="anim-meta"></dl>
      </div>
    </div>
    <div id="font-wrap">
      <div id="font-list"></div>
      <div id="font-stage">
        <div class="font-panel">
          <h3>示例文本渲染</h3>
          <input type="text" id="font-sample-input" placeholder="输入示例文本（仅含字体内字符）" />
          <div><canvas id="font-sample-canvas"></canvas></div>
        </div>
        <div class="anim-controls" style="margin:0">
          <button type="button" id="font-dl-one" disabled>⬇ 当前字体 (.fnt + .png)</button>
          <button type="button" id="font-dl-all" disabled>⬇ 全部字体</button>
          <span id="font-status" class="anim-status"></span>
        </div>
        <div class="font-panel">
          <h3>字体图集</h3>
          <img id="font-atlas-img" alt="" />
        </div>
        <dl class="kv" id="font-meta"></dl>
      </div>
    </div>
    <aside id="detail">
      <h2 id="d-name"></h2>
      <div class="preview"><img id="d-img" alt="" /></div>
      <dl class="kv" id="d-meta"></dl>
    </aside>
  </main>
  <div id="drop-overlay"><div class="box">松开以加载 HAR（自动识别引擎）</div></div>
  <script src="vendor/spine-player-3.8.js"></script>
  <script src="spine-bake.js"></script>
  <script>
    // Catalog is loaded at runtime from catalog.json (built data directory).
    // The viewer itself carries no HAR data — it starts empty and tabs come
    // from the data dir or live uploads.
    let tabs = [];
    let activeTab = null;
    let textures = [];
    let meta = {};
    let categories = [];
    let extensions = [];
    let resourceTypes = [];

    document.getElementById('title').textContent = 'HAR Texture Viewer';

    const catEl = document.getElementById('cat-filter');
    const extEl = document.getElementById('ext-filter');
    const typeEl = document.getElementById('type-filter');
    const tabsEl = document.getElementById('tabs');

    const TYPE_LABELS = {
      spine: 'Spine',
      'spine-sequence': 'Spine 序列帧',
      'sprite-atlas': 'Sprite Atlas',
      'sprite-sequence': '序列帧 Atlas',
      static: '静态图',
    };

    function renderTabs() {
      tabsEl.innerHTML = '';
      for (const tab of tabs) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab' +
          (tab.id === activeTab?.id ? ' active' : '') +
          (tab.meta?.missing ? ' missing' : '');
        const n = tab.meta?.missing ? 0 : (tab.meta?.total ?? tab.textures?.length ?? 0);
        btn.textContent = `${tab.label} (${n})`;
        btn.onclick = () => {
          if (tab.meta?.missing) return;
          if (tab.id === activeTab?.id) return;
          activateTab(tab);
        };
        tabsEl.appendChild(btn);
      }
    }

    function activateTab(tab) {
      activeTab = tab;
      textures = tab.textures ?? [];
      meta = tab.meta ?? {};
      categories = tab.categories ?? [];
      extensions = tab.extensions ?? [];
      resourceTypes = tab.resourceTypes ?? [];
      animationManifest = tab.animationManifest ?? [];
      fontManifest = tab.fontManifest ?? [];
      currentFont = null;
      selectedId = null;
      stopAnimPlayer();
      updateAnimButtonState();
      updateFontButtonState();
      rebuildFilters();
      renderTabs();
      if (viewMode === 'animations') {
        ensureAnimationManifest().then(() => renderAnimList());
      } else if (viewMode === 'fonts') {
        renderFontList();
      } else applyFilters();
    }

    function setUploadHint(msg, cls) {
      const el = document.getElementById('upload-hint');
      el.textContent = msg;
      el.className = 'upload-hint' + (cls ? ` ${cls}` : '');
    }

    const ENGINE_LABELS = { cocos: 'Cocos Creator', pragmatic: 'Pragmatic Play', slotmill: 'Slotmill' };

    async function uploadHar(file) {
      if (!file) return;
      const btn = document.getElementById('add-har-btn');
      btn.classList.add('busy');
      setUploadHint(`上传解析中：${file.name}…`);
      try {
        const res = await fetch('/upload', {
          method: 'POST',
          headers: { 'x-file-name': encodeURIComponent(file.name) },
          body: file,
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '解析失败');
        const tab = data.tab;
        const existing = tabs.findIndex((t) => t.id === tab.id);
        if (existing >= 0) tabs.splice(existing, 1, tab);
        else tabs.push(tab);
        const eng = ENGINE_LABELS[data.detection?.engine] ?? data.detection?.engine ?? '?';
        const conf = data.detection?.confident ? '' : '（低置信度）';
        setUploadHint(`已加载 ${tab.label} · 引擎 ${eng}${conf} · ${tab.meta?.total ?? 0} 纹理`, 'ok');
        activateTab(tab);
      } catch (err) {
        setUploadHint(`加载失败：${err.message}`, 'error');
      } finally {
        btn.classList.remove('busy');
      }
    }

    document.getElementById('add-har-btn').onclick = () =>
      document.getElementById('har-file-input').click();
    document.getElementById('har-file-input').onchange = (e) => {
      const f = e.target.files?.[0];
      e.target.value = '';
      uploadHar(f);
    };

    (() => {
      const overlay = document.getElementById('drop-overlay');
      let depth = 0;
      const isFile = (e) => [...(e.dataTransfer?.types ?? [])].includes('Files');
      window.addEventListener('dragenter', (e) => {
        if (!isFile(e)) return;
        e.preventDefault();
        depth++;
        overlay.classList.add('show');
      });
      window.addEventListener('dragover', (e) => {
        if (isFile(e)) e.preventDefault();
      });
      window.addEventListener('dragleave', (e) => {
        if (!isFile(e)) return;
        depth = Math.max(0, depth - 1);
        if (!depth) overlay.classList.remove('show');
      });
      window.addEventListener('drop', (e) => {
        if (!isFile(e)) return;
        e.preventDefault();
        depth = 0;
        overlay.classList.remove('show');
        const f = e.dataTransfer.files?.[0];
        if (f) uploadHar(f);
      });
    })();

    function rebuildFilters() {
      catEl.innerHTML = '<option value="">全部分类</option>';
      extEl.innerHTML = '<option value="">全部格式</option>';
      typeEl.innerHTML = '<option value="">全部类型</option>';
      categories.forEach((c) => {
        const o = document.createElement('option');
        o.value = c; o.textContent = c;
        catEl.appendChild(o);
      });
      extensions.forEach((e) => {
        const o = document.createElement('option');
        o.value = e; o.textContent = e;
        extEl.appendChild(o);
      });
      resourceTypes.forEach((rt) => {
        const o = document.createElement('option');
        o.value = rt;
        o.textContent = TYPE_LABELS[rt] ?? rt;
        typeEl.appendChild(o);
      });
      updateSubtitle();
    }

    function typeBadgeClass(t) {
      if (t.resourceType?.startsWith('spine')) return 'spine';
      if (t.resourceType?.includes('sequence')) return 'seq';
      return 'static';
    }

    function typeLabel(t) {
      return TYPE_LABELS[t.resourceType] ?? t.resourceType ?? '';
    }

    function updateSubtitle() {
      const parts = [
        meta.harPath,
        `${meta.total ?? textures.length} 张纹理`,
        meta.embedded != null ? `内嵌 ${meta.embedded}` : null,
        meta.remote != null ? `远程 ${meta.remote}` : null,
        meta.fromJson != null ? `JSON ${meta.fromJson}` : null,
        meta.channel ? `channel ${meta.channel}` : null,
        meta.spineCount != null ? `Spine ${meta.spineCount}` : null,
        meta.previewCount != null ? `可预览 ${meta.previewCount}` : null,
      ].filter(Boolean);
      document.getElementById('subtitle').textContent = parts.join(' · ');
    }

    let selectedId = null;
    let filtered = [...textures];

    function pixelArea(t) {
      return (t.width && t.height) ? t.width * t.height : 0;
    }

    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase();
      const cat = catEl.value;
      const ext = extEl.value;
      const rtype = typeEl.value;
      const sort = document.getElementById('sort').value;

      filtered = textures.filter((t) => {
        if (cat && t.category !== cat) return false;
        if (ext && t.ext !== ext) return false;
        if (rtype && t.resourceType !== rtype) return false;
        if (q && !(`${t.fileName} ${t.path} ${t.spineName ?? ''} ${t.sequencePrefix ?? ''}`.toLowerCase().includes(q))) return false;
        return true;
      });

      filtered.sort((a, b) => {
        if (sort === 'size-desc') return b.size - a.size;
        if (sort === 'size-asc') return a.size - b.size;
        if (sort === 'name-asc') return a.fileName.localeCompare(b.fileName);
        if (sort === 'pixels-desc') return pixelArea(b) - pixelArea(a);
        return 0;
      });

      renderGrid();
      updateStats();
    }

    function updateStats() {
      const totalBytes = filtered.reduce((s, t) => s + (t.size || 0), 0);
      const mb = (totalBytes / 1024 / 1024).toFixed(2);
      document.getElementById('stats').innerHTML =
        `显示 <strong>${filtered.length}</strong> / ${textures.length} · 合计 <strong>${mb} MB</strong>`;
    }

    function imgSrc(t) {
      if (t.srcType === 'embedded') return t.src;
      return t.src;
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      if (!filtered.length) {
        grid.innerHTML = '<div class="empty">无匹配纹理</div>';
        return;
      }
      for (const t of filtered) {
        const card = document.createElement('article');
        card.className = 'card' + (selectedId === t.id ? ' active' : '');
        card.dataset.id = t.id;

        const dim = t.width && t.height ? `${t.width}×${t.height}` : '';
        const rt = typeLabel(t);
        card.innerHTML = `
          <div class="thumb-wrap">
            ${rt ? `<span class="badge-type ${typeBadgeClass(t)}">${rt}</span>` : ''}
            <span class="badge">${t.ext.replace('.', '')}</span>
            <img loading="lazy" alt="${t.fileName}" src="${imgSrc(t)}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
            <div class="placeholder" style="display:none">${t.ext}<br/>加载失败</div>
          </div>
          <div class="card-body">
            <div class="name" title="${t.path}">${t.spineName ?? t.fileName}</div>
            <div class="sub">${t.sizeFmt}${dim ? ' · ' + dim : ''}${t.sequenceFrameCount ? ' · ' + t.sequenceFrameCount + '帧' : ''}</div>
          </div>`;
        card.onclick = () => selectTexture(t);
        grid.appendChild(card);
      }
    }

    function selectTexture(t) {
      selectedId = t.id;
      document.getElementById('detail').classList.add('open');
      document.getElementById('d-name').textContent = t.fileName;
      const img = document.getElementById('d-img');
      img.src = imgSrc(t);
      img.alt = t.fileName;

      const rows = [
        ['路径', t.path],
        ['资源类型', typeLabel(t) || t.resourceType || 'static'],
        ['分类', t.category],
        ['格式', t.mime || t.ext],
        ['磁盘体积', t.sizeFmt + (t.size ? ` (${t.size.toLocaleString()} B)` : '')],
        ['来源', t.srcType === 'embedded' ? 'HAR 内嵌' : t.srcType === 'data' ? 'Data URL' : 'CDN 远程'],
      ];
      if (t.spineName) {
        rows.push(['Spine 名称', t.spineName]);
        if (animationManifest.some((a) => a.name === t.spineName)) {
          rows.push(['动画预览', `<button type="button" class="btn-link" id="open-anim-preview">▶ 打开动画预览</button>`]);
        }
      }
      if (t.sequencePrefix) rows.push(['序列帧前缀', `${t.sequencePrefix}_*`]);
      if (t.sequenceFrameCount) rows.push(['序列帧数', String(t.sequenceFrameCount)]);
      if (t.atlasRegions) rows.push(['Atlas 区域', `${t.atlasRegions} 个`]);
      if (t.atlasFrameCount) rows.push(['Atlas 子图', `${t.atlasFrameCount} 张`]);
      if (t.channel) rows.push(['Channel', t.channel]);
      if (t.source && t.source !== 'direct') rows.push(['资源包', t.source]);
      if (t.width && t.height) {
        rows.push(['Atlas 尺寸', `${t.width} × ${t.height}`]);
        rows.push(['VRAM 估算 (RGBA)', `${((t.width * t.height * 4) / 1024 / 1024).toFixed(2)} MB`]);
      }
      if (t.atlasRegions) rows.push(['Atlas 子图', `${t.atlasRegions} 区域`]);
      if (t.atlasPath) rows.push(['Atlas 文件', t.atlasPath]);
      rows.push(['URL', `<a href="${t.url}" target="_blank" rel="noopener">${t.url}</a>`]);

      document.getElementById('d-meta').innerHTML = rows.map(([k, v]) =>
        `<dt>${k}</dt><dd>${v}</dd>`).join('');
      const openBtn = document.getElementById('open-anim-preview');
      if (openBtn && t.spineName) {
        openBtn.onclick = () => {
          setViewMode('animations');
          const item = animationManifest.find((a) => a.name === t.spineName);
          if (item) selectAnimation(item);
        };
      }
      renderGrid();
    }

    // ---- Animation preview ----
    let viewMode = 'textures';
    let animationManifest = [];
    let animFiltered = [];
    let currentAnimItem = null;
    let fontManifest = [];
    let fontFiltered = [];
    let currentFont = null;
    let fontAtlasImage = null;
    let currentAnimPack = null;
    let animImage = null;
    let animPlaying = false;
    let animFrameIdx = 0;
    let animTimer = null;
    let animFrames = [];

    const animCanvasSpine = document.getElementById('anim-canvas-spine');
    const animCanvas2d = document.getElementById('anim-canvas-2d');
    const animPlayerEl = document.getElementById('anim-player');
    const animPlayer37El = document.getElementById('anim-player-37');
    let spine37Active = false;
    let spine37Ready = null;
    // 'fit' or a numeric scale factor (1 = original pixel size).
    let animZoomMode = 'fit';
    let animCtx = null;
    let animMode = 'none';
    let spineRenderer = null;
    let spineInstance = null;
    let spinePlayerWidget = null;
    let spineRaf = null;
    let spineLastTs = 0;

    // Cocos exports often reference regions living in another blob's atlas.
    // Returning null (instead of throwing) lets SkeletonJson simply skip the
    // attachment — this makes both the official SpinePlayer and the fallback
    // renderer tolerant of missing regions.
    const spineMissingRegions = new Set();
    for (const m of ['newRegionAttachment', 'newMeshAttachment']) {
      const orig = spine.AtlasAttachmentLoader.prototype[m];
      spine.AtlasAttachmentLoader.prototype[m] = function (skin, name, path) {
        if (path && !this.atlas.findRegion(path)) {
          spineMissingRegions.add(path);
          return null;
        }
        return orig.call(this, skin, name, path);
      };
    }

    function showAnimSurface(kind) {
      animPlayerEl.style.display = kind === 'player' ? 'block' : 'none';
      animPlayer37El.style.display = kind === 'player37' ? 'block' : 'none';
      animCanvasSpine.style.display = kind === 'canvas' ? 'block' : 'none';
      animCanvas2d.style.display = kind === '2d' ? 'block' : 'none';
    }

    function updateAnimButtonState() {
      const animBtn = document.getElementById('mode-anim-btn');
      const count = animationManifest.length || meta.previewCount || 0;
      animBtn.disabled = count === 0;
      animBtn.title = count === 0
        ? '当前 Tab 无动画资源（仅 Cocos HAR 支持）'
        : `可预览 ${animationManifest.length || count} 个`;
      if (count === 0 && viewMode === 'animations') applyViewMode('textures');
    }

    async function ensureAnimationManifest() {
      if (animationManifest.length) return animationManifest;
      const n = meta.previewCount ?? 0;
      if (!n || !activeTab?.id) return [];
      try {
        const res = await fetch(`animations/${activeTab.id}/manifest.json`);
        if (!res.ok) return [];
        const data = await res.json();
        animationManifest = data.items ?? [];
        activeTab.animationManifest = animationManifest;
        updateAnimButtonState();
      } catch {
        /* ignore */
      }
      return animationManifest;
    }

    function setViewMode(mode) {
      if (mode === 'animations') {
        ensureAnimationManifest().then((items) => {
          if (!items.length && !(meta.previewCount ?? 0)) return;
          applyViewMode(mode);
        });
        return;
      }
      applyViewMode(mode);
    }

    function applyViewMode(mode) {
      viewMode = mode;
      document.querySelectorAll('.mode-tab').forEach((b) => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
      document.getElementById('grid-wrap').style.display = mode === 'textures' ? 'block' : 'none';
      document.getElementById('anim-wrap').classList.toggle('open', mode === 'animations');
      document.getElementById('font-wrap').classList.toggle('open', mode === 'fonts');
      document.getElementById('toolbar-textures').style.display = mode === 'textures' ? 'flex' : 'none';
      document.getElementById('toolbar-anim').style.display = mode === 'animations' ? 'flex' : 'none';
      document.getElementById('toolbar-font').style.display = mode === 'fonts' ? 'flex' : 'none';
      document.getElementById('detail').style.display = mode === 'textures' ? '' : 'none';
      if (mode === 'animations') {
        renderAnimList();
        updateAnimStats();
      } else if (mode === 'fonts') {
        stopAnimPlayer();
        renderFontList();
      } else {
        stopAnimPlayer();
        updateStats();
      }
    }

    document.querySelectorAll('.mode-tab').forEach((b) => {
      b.onclick = () => {
        if (b.disabled) return;
        setViewMode(b.dataset.mode);
      };
    });

    function updateAnimStats() {
      document.getElementById('stats').innerHTML =
        `可预览 <strong>${animFiltered.length}</strong> / ${animationManifest.length} 个动画资源`;
    }

    function renderAnimList() {
      const q = document.getElementById('anim-search').value.toLowerCase();
      const tf = document.getElementById('anim-type-filter').value;
      animFiltered = animationManifest.filter((a) => {
        if (tf && a.type !== tf) return false;
        if (q && !(`${a.name} ${a.type} ${a.bundle}`.toLowerCase().includes(q))) return false;
        return true;
      });
      const list = document.getElementById('anim-list');
      list.innerHTML = '';
      if (!animFiltered.length) {
        list.innerHTML = '<div class="empty">当前 Tab 无可预览动画（需 Cocos HAR + 内嵌纹理）</div>';
        updateBakeButtons();
        return;
      }
      for (const item of animFiltered) {
        const el = document.createElement('div');
        el.className = 'anim-item' + (currentAnimItem?.id === item.id ? ' active' : '');
        const seq = item.sequenceGroups?.[0];
        el.innerHTML = `<div class="title">${item.name}</div><div class="sub">${TYPE_LABELS[item.type] ?? item.type} · ${item.regionCount} regions${seq ? ` · ${seq.prefix}_×${seq.count}` : ''}</div>`;
        el.onclick = () => selectAnimation(item);
        list.appendChild(el);
      }
      updateAnimStats();
      updateBakeButtons();
    }

    async function selectAnimation(item) {
      stopAnimPlayer();
      disposeSpinePlayer();
      currentAnimItem = item;
      renderAnimList();
      const res = await fetch(item.previewFile);
      currentAnimPack = await res.json();
      setupAnimControls();
      if (useSpineRuntime(currentAnimPack)) {
        animMode = 'spine';
        try {
          await setupSpinePlayer(currentAnimPack);
        } catch (err) {
          console.error('Spine runtime failed', err);
          animMode = 'error';
          showAnimSurface('canvas');
          const status = document.getElementById('anim-status');
          if (status) status.textContent = `Spine 加载失败: ${err.message}`;
        }
      } else {
        showAnimSurface('2d');
        animMode = 'canvas';
        await setupCanvasPlayer();
      }
      renderAnimMeta();
      updateBakeButtons();
    }

    function useSpineRuntime(pack) {
      return !!(pack?.skeletonJson && pack?.atlasText && String(pack.type ?? '').startsWith('spine'));
    }

    function disposeSpinePlayer() {
      if (spinePlayerWidget) {
        try { spinePlayerWidget.stopRendering(); } catch { /* ignore */ }
        spinePlayerWidget = null;
      }
      animPlayerEl.innerHTML = '';
      spine37Active = false;
      spine37Ready = null;
      animPlayer37El.src = 'about:blank';
      spineInstance = null;
      spineRenderer = null;
      spineLastTs = 0;
    }

    function spine37Send(msg) {
      animPlayer37El.contentWindow?.postMessage({ type: 'spine37', ...msg }, '*');
    }

    /**
     * Spine 3.7 skeletons animate incorrectly on the 3.8 runtime, so they get a
     * dedicated 3.7 runtime inside an iframe (a second global `spine` can't
     * coexist with the 3.8 build on this page).
     */
    function setupSpine37Player(pack) {
      const anim =
        document.getElementById('anim-clip').value ||
        pack.defaultAnimation ||
        pack.animationNames?.[0] ||
        '';
      const url =
        `spine37-player.html?skel=${encodeURIComponent(pack.skelUrl)}` +
        `&atlas=${encodeURIComponent(pack.atlasUrl)}` +
        (anim ? `&anim=${encodeURIComponent(anim)}` : '');

      return new Promise((resolve, reject) => {
        spine37Ready = { resolve, reject, pack };
        spine37Active = true;
        showAnimSurface('player37');
        animPlayer37El.src = url;
        setTimeout(() => {
          if (spine37Ready?.pack === pack) {
            spine37Ready = null;
            reject(new Error('Spine 3.7 播放器加载超时'));
          }
        }, 15000);
      });
    }

    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (msg?.type !== 'spine37' || !spine37Ready) return;
      const { resolve, reject, pack } = spine37Ready;
      if (msg.event === 'ready') {
        spine37Ready = null;
        pack._player = 'spine37';
        if (animZoomMode !== 'fit') spine37Send({ cmd: 'zoom', mode: animZoomMode });
        pack._runtimeMissingRegions = msg.missingRegions ?? [];
        pack._runtimeMissingPages = msg.missingPages ?? [];
        animPlaying = true;
        const status = document.getElementById('anim-status');
        if (status) {
          const miss = pack._runtimeMissingPages.length ? ` · 缺 ${pack._runtimeMissingPages.length} 张 atlas 页` : '';
          const missReg = pack._runtimeMissingRegions.length ? ` · 缺 ${pack._runtimeMissingRegions.length} 个 region` : '';
          status.textContent = `Spine Runtime 3.7（专用）· ${msg.version}${miss}${missReg}`;
        }
        renderAnimMeta();
        resolve();
      } else if (msg.event === 'error') {
        spine37Ready = null;
        reject(new Error(msg.message));
      }
    });

    function isSpine37(pack) {
      return /^3\.7/.test(String(pack?.spineVersion ?? ''));
    }

    /**
     * Override the official player's viewport to get a fixed pixel scale.
     * drawFrame derives camera.zoom from viewport.width / canvas width, so a
     * viewport of (canvas size / s) centered on the animation renders at s×
     * (s = 1 → one skeleton unit per CSS pixel, i.e. original size).
     */
    function applyOfficialZoom() {
      const p = spinePlayerWidget;
      if (!p?.currentViewport) return;
      const vp = p.currentViewport;
      if (!p._fitViewport) p._fitViewport = { ...vp };
      const fit = p._fitViewport;
      p.previousViewport = null; // skip the viewport transition animation
      if (animZoomMode === 'fit') {
        Object.assign(vp, fit);
        return;
      }
      const s = parseFloat(animZoomMode) || 1;
      const cw = p.canvas.clientWidth || 760;
      const ch = p.canvas.clientHeight || 480;
      const cx = fit.x + fit.width / 2;
      const cy = fit.y + fit.height / 2;
      vp.width = cw / s;
      vp.height = ch / s;
      vp.x = cx - vp.width / 2;
      vp.y = cy - vp.height / 2;
      vp.padLeft = 0;
      vp.padRight = 0;
      vp.padTop = 0;
      vp.padBottom = 0;
    }

    function loadImageSrc(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function parseAtlasPageList(atlasText) {
      const pages = [];
      const lines = String(atlasText ?? '').split('\n');
      for (let i = 0; i < lines.length - 1; i++) {
        const line = lines[i].trim();
        if (!/\.(png|jpg|webp)$/i.test(line)) continue;
        const sm = lines[i + 1]?.trim().match(/^size:\s*(\d+)\s*,\s*(\d+)/i);
        if (sm) pages.push({ page: line, width: +sm[1], height: +sm[2] });
      }
      return pages;
    }

    function createPlaceholderImage(width, height) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, width);
      c.height = Math.max(1, height);
      return c;
    }

    async function loadSpineTextures(pack) {
      const atlasPages = parseAtlasPageList(pack.atlasText);
      const mapped = pack.texturePages ?? {};
      const out = {};
      const missing = [];

      for (const page of atlasPages) {
        const hit = mapped[page.page];
        if (hit?.textureSrc) {
          try {
            out[page.page] = await loadImageSrc(hit.textureSrc);
          } catch {
            out[page.page] = createPlaceholderImage(page.width, page.height);
            missing.push(page.page);
          }
        } else {
          out[page.page] = createPlaceholderImage(page.width, page.height);
          missing.push(page.page);
        }
      }

      if (!atlasPages.length && pack.textureSrc) {
        const page = pack.texturePage || 'page.png';
        out[page] = await loadImageSrc(pack.textureSrc);
      }

      pack._runtimeMissingPages = missing;
      return out;
    }

    function normalizeSkeletonJson(json) {
      if (!json?.skins || Array.isArray(json.skins)) return json;
      return {
        ...json,
        skins: Object.entries(json.skins).map(([name, data]) =>
          data?.attachments ? { name, ...data } : { name, attachments: data ?? {} },
        ),
      };
    }

    function normalizeAtlasText(text) {
      return String(text ?? '').replace(
        /size:\s*(\d+)\s*,\s*(\d+)\r?\n+\r?\n+(format:)/gi,
        'size: $1,$2\n$3',
      );
    }

    function createTolerantAtlasLoader(atlas) {
      const base = new spine.AtlasAttachmentLoader(atlas);
      const missing = new Set();
      const wrap =
        (fn) =>
        (...args) => {
          const path = args[2] ?? args[1];
          if (path && !atlas.findRegion(path)) {
            missing.add(path);
            return null;
          }
          return fn.apply(base, args);
        };
      return {
        newRegionAttachment: wrap(base.newRegionAttachment.bind(base)),
        newMeshAttachment: wrap(base.newMeshAttachment.bind(base)),
        newBoundingBoxAttachment: base.newBoundingBoxAttachment.bind(base),
        newPathAttachment: base.newPathAttachment.bind(base),
        newPointAttachment: base.newPointAttachment.bind(base),
        newClippingAttachment: base.newClippingAttachment.bind(base),
        _missingRegions: missing,
      };
    }

    /**
     * Load a Spine pack the same way a Spine online viewer does: fetch the
     * exported skeleton.json / skeleton.atlas / page images over HTTP. Falls
     * back to the legacy in-memory (embedded) data when export URLs are absent.
     */
    async function loadSpineSource(pack) {
      if (pack.skelUrl && pack.atlasUrl) {
        const [skelRaw, atlasRaw] = await Promise.all([
          fetch(pack.skelUrl).then((r) => {
            if (!r.ok) throw new Error(`skeleton.json ${r.status}`);
            return r.json();
          }),
          fetch(pack.atlasUrl).then((r) => {
            if (!r.ok) throw new Error(`skeleton.atlas ${r.status}`);
            return r.text();
          }),
        ]);
        const atlasText = normalizeAtlasText(atlasRaw);
        const base = pack.atlasUrl.slice(0, pack.atlasUrl.lastIndexOf('/') + 1);
        const images = {};
        const missing = [];
        for (const page of parseAtlasPageList(atlasText)) {
          const url = pack.pageUrls?.[page.page] ?? `${base}${page.page}`;
          try {
            images[page.page] = await loadImageSrc(url);
          } catch {
            images[page.page] = createPlaceholderImage(page.width, page.height);
            missing.push(page.page);
          }
        }
        pack._runtimeMissingPages = missing;
        return { skeletonJson: skelRaw, atlasText, images };
      }

      const images = await loadSpineTextures(pack);
      return {
        skeletonJson: normalizeSkeletonJson(pack.skeletonJson),
        atlasText: normalizeAtlasText(pack.atlasText),
        images,
      };
    }

    function placeholderPageDataUri(width, height) {
      return createPlaceholderImage(width, height).toDataURL('image/png');
    }

    /**
     * Preferred path: the official Esoteric spine-player 3.8 widget. It handles
     * PMA, devicePixelRatio, per-animation viewports and ships its own UI
     * (timeline / speed / animation & skin pickers).
     */
    async function setupOfficialSpinePlayer(pack) {
      const atlasRes = await fetch(pack.atlasUrl);
      if (!atlasRes.ok) throw new Error(`skeleton.atlas ${atlasRes.status}`);
      const atlasText = normalizeAtlasText(await atlasRes.text());
      const dir = pack.atlasUrl.slice(0, pack.atlasUrl.lastIndexOf('/') + 1);

      // Feed the (normalized) atlas via rawDataURIs and remap page images the
      // player would 404 on to placeholders, so partial HARs still play.
      const rawDataURIs = {
        [pack.atlasUrl]: 'data:text/plain;charset=utf-8,' + encodeURIComponent(atlasText),
      };
      const missingPages = [];
      for (const page of parseAtlasPageList(atlasText)) {
        const expected = `${dir}${page.page}`;
        const actual = pack.pageUrls?.[page.page];
        if (!actual) {
          missingPages.push(page.page);
          rawDataURIs[expected] = placeholderPageDataUri(page.width, page.height);
        } else if (actual !== expected) {
          rawDataURIs[expected] = actual;
        }
      }
      pack._runtimeMissingPages = missingPages;

      spineMissingRegions.clear();
      await new Promise((resolve, reject) => {
        spinePlayerWidget = new spine.SpinePlayer(animPlayerEl, {
          jsonUrl: pack.skelUrl,
          atlasUrl: pack.atlasUrl,
          rawDataURIs,
          animation: pack.defaultAnimation || pack.animationNames?.[0] || undefined,
          premultipliedAlpha: false,
          backgroundColor: '#12151c',
          alpha: false,
          showControls: true,
          success: () => resolve(),
          error: (_widget, msg) => reject(new Error(msg)),
        });
      });
      pack._runtimeMissingRegions = [...spineMissingRegions];
      pack._player = 'official';

      // Re-apply the zoom override whenever the player recomputes its viewport
      // (both our select and the player's built-in animation picker end here).
      const origSetAnimation = spinePlayerWidget.setAnimation.bind(spinePlayerWidget);
      spinePlayerWidget.setAnimation = (name, loop) => {
        origSetAnimation(name, loop);
        spinePlayerWidget._fitViewport = null;
        applyOfficialZoom();
      };
      applyOfficialZoom();

      showAnimSurface('player');
      spinePlayerWidget.play();
      animPlaying = true;
      const status = document.getElementById('anim-status');
      if (status) {
        const miss = missingPages.length ? ` · 缺 ${missingPages.length} 张 atlas 页` : '';
        const missReg = pack._runtimeMissingRegions.length
          ? ` · 缺 ${pack._runtimeMissingRegions.length} 个 region`
          : '';
        status.textContent = `Spine Web Player 3.8（官方）${miss}${missReg}`;
      }
    }

    async function setupSpinePlayer(pack) {
      disposeSpinePlayer();
      if (pack.skelUrl && pack.atlasUrl && isSpine37(pack)) {
        try {
          await setupSpine37Player(pack);
          return;
        } catch (err) {
          console.warn('Spine 3.7 专用播放器失败，尝试 3.8', err);
          disposeSpinePlayer();
        }
      }
      if (pack.skelUrl && pack.atlasUrl && window.spine?.SpinePlayer) {
        try {
          await setupOfficialSpinePlayer(pack);
          return;
        } catch (err) {
          console.warn('官方 SpinePlayer 加载失败，回退到内置渲染器', err);
          disposeSpinePlayer();
        }
      }
      await setupSpineFallback(pack);
    }

    async function setupSpineFallback(pack) {
      disposeSpinePlayer();
      if (!window.spine?.webgl) throw new Error('Spine 3.8 runtime not loaded');
      showAnimSurface('canvas');
      pack._player = 'fallback';

      const cw = animCanvasSpine.clientWidth || 640;
      const ch = animCanvasSpine.clientHeight || 480;
      animCanvasSpine.width = cw;
      animCanvasSpine.height = ch;
      const gl = animCanvasSpine.getContext('webgl', { alpha: false, premultipliedAlpha: true });
      if (!gl) throw new Error('WebGL unavailable');

      spineRenderer = new spine.webgl.SceneRenderer(animCanvasSpine, gl, false);

      const { skeletonJson, atlasText, images } = await loadSpineSource(pack);
      const atlas = new spine.TextureAtlas(atlasText, (path) => {
        const img = images[path] ?? createPlaceholderImage(4, 4);
        return new spine.webgl.GLTexture(spineRenderer.context, img);
      });
      const atlasLoader = createTolerantAtlasLoader(atlas);
      const skelReader = new spine.SkeletonJson(atlasLoader);
      const skeletonData = skelReader.readSkeletonData(skeletonJson);
      pack._runtimeMissingRegions = [...atlasLoader._missingRegions];

      const skeleton = new spine.Skeleton(skeletonData);
      if (skeletonData.defaultSkin) {
        skeleton.setSkin(skeletonData.defaultSkin);
      } else if (skeletonData.skins?.length) {
        skeleton.setSkin(skeletonData.skins[0]);
      }
      skeleton.setSlotsToSetupPose();
      skeleton.setToSetupPose();
      skeleton.updateWorldTransform();

      const state = new spine.AnimationState(new spine.AnimationStateData(skeletonData));
      const anim =
        document.getElementById('anim-clip').value ||
        pack.defaultAnimation ||
        skeletonData.animations?.[0]?.name;
      if (anim) state.setAnimation(0, anim, true);

      // getBounds measures actual region/mesh art (SkeletonBounds only covers
      // bounding-box attachments, which most skins lack → 0 size / NaN camera).
      const offset = new spine.Vector2();
      const size = new spine.Vector2();
      skeleton.getBounds(offset, size, []);
      const skW = size.x > 0 ? size.x : 400;
      const skH = size.y > 0 ? size.y : 400;
      const cx = Number.isFinite(offset.x) ? offset.x + skW / 2 : 0;
      const cy = Number.isFinite(offset.y) ? offset.y + skH / 2 : 0;

      spineInstance = { skeleton, state, cx, cy, skW, skH };

      // Continuous render loop keeps redrawing even while paused, so a canvas
      // that was just made visible (clientWidth 0 on first paint) still renders.
      animPlaying = true;
      spineLastTs = 0;
      cancelAnimationFrame(spineRaf);
      spineRaf = requestAnimationFrame(spineLoop);
    }

    function fitSpineCamera() {
      if (!spineInstance || !spineRenderer) return;
      const cw = animCanvasSpine.width;
      const ch = animCanvasSpine.height;
      spineRenderer.camera.setViewport(cw, ch);
      spineRenderer.camera.position.set(spineInstance.cx, spineInstance.cy, 0);
      spineRenderer.camera.zoom = animZoomMode === 'fit'
        ? Math.max(spineInstance.skW / cw, spineInstance.skH / ch) * 1.15
        : 1 / (parseFloat(animZoomMode) || 1);
      spineRenderer.camera.update();
    }

    function drawSpineFrame() {
      if (!spineInstance || !spineRenderer) return;
      const gl = spineRenderer.context.gl;
      spineRenderer.resize(spine.webgl.ResizeMode.Expand);
      fitSpineCamera();
      gl.clearColor(0.07, 0.08, 0.11, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      spineRenderer.begin();
      spineRenderer.drawSkeleton(spineInstance.skeleton, false);
      spineRenderer.end();
      const status = document.getElementById('anim-status');
      if (status) {
        const miss = currentAnimPack?._runtimeMissingPages?.length
          ? ` · 缺 ${currentAnimPack._runtimeMissingPages.length} 张 atlas 页`
          : '';
        const missReg = currentAnimPack?._runtimeMissingRegions?.length
          ? ` · 缺 ${currentAnimPack._runtimeMissingRegions.length} 个 region`
          : '';
        status.textContent = (animPlaying ? '播放中 · Spine Runtime 3.8' : 'Spine Runtime 3.8 · 暂停') + miss + missReg;
      }
    }

    function spineLoop(ts) {
      if (animMode !== 'spine' || !spineInstance) return;
      spineRaf = requestAnimationFrame(spineLoop);
      if (!spineLastTs) spineLastTs = ts;
      const delta = Math.min(0.05, (ts - spineLastTs) / 1000);
      spineLastTs = ts;
      if (animPlaying) {
        const { state, skeleton } = spineInstance;
        state.update(delta);
        state.apply(skeleton);
        skeleton.updateWorldTransform();
      }
      drawSpineFrame();
    }

    function spineSetAnimation(name) {
      if (!name) return;
      if (spine37Active) {
        spine37Send({ cmd: 'anim', name });
        animPlaying = true;
        return;
      }
      if (spinePlayerWidget) {
        spinePlayerWidget.setAnimation(name, true);
        spinePlayerWidget.play();
        animPlaying = true;
        return;
      }
      if (!spineInstance) return;
      spineInstance.state.setAnimation(0, name, true);
      animPlaying = true;
      spineLastTs = 0;
      cancelAnimationFrame(spineRaf);
      spineRaf = requestAnimationFrame(spineLoop);
    }

    async function setupCanvasPlayer() {
      animCtx = animCtx || animCanvas2d.getContext('2d');
      await loadAnimImage();
      rebuildAnimFrames();
      animFrameIdx = 0;
      drawAnimFrame();
    }

    function setupAnimControls() {
      const clipEl = document.getElementById('anim-clip');
      const seqEl = document.getElementById('anim-seq');
      clipEl.innerHTML = '';
      seqEl.innerHTML = '';

      const anims = currentAnimPack.animationNames ?? [];
      if (anims.length) {
        for (const n of anims) {
          const o = document.createElement('option');
          o.value = n; o.textContent = n;
          clipEl.appendChild(o);
        }
        clipEl.value = currentAnimPack.defaultAnimation ?? anims[0];
      } else {
        const o = document.createElement('option');
        o.value = ''; o.textContent = '(无 Spine 动画)';
        clipEl.appendChild(o);
      }

      const groups = currentAnimPack.sequenceGroups ?? [];
      if (groups.length) {
        for (const g of groups) {
          const o = document.createElement('option');
          o.value = g.prefix;
          o.textContent = `${g.prefix}_* (${g.count}帧)`;
          seqEl.appendChild(o);
        }
      } else {
        const o = document.createElement('option');
        o.value = ''; o.textContent = '(全部 regions)';
        seqEl.appendChild(o);
      }
    }

    function loadAnimImage() {
      return new Promise((resolve, reject) => {
        animImage = new Image();
        animImage.onload = () => resolve();
        animImage.onerror = reject;
        animImage.src = currentAnimPack.textureSrc;
      });
    }

    function rebuildAnimFrames() {
      animFrames = [];
      const pack = currentAnimPack;
      const animName = document.getElementById('anim-clip').value;
      const seqPrefix = document.getElementById('anim-seq').value;
      const baked = pack.bakedFrames?.[animName];
      const fps = parseInt(document.getElementById('anim-fps').value, 10) || 12;

      if (baked?.length) {
        animFrames = baked.map((f) => ({
          layers: f.layers,
          duration: f.duration || (1 / fps),
        }));
        return;
      }

      const timelines = pack.timelines ?? {};

      if (animName && timelines[animName]) {
        const slots = timelines[animName];
        const slotName = Object.keys(slots).find((s) => slots[s]?.length) ?? Object.keys(slots)[0];
        const tl = slots[slotName] ?? [];
        for (let i = 0; i < tl.length; i++) {
          const cur = tl[i];
          const next = tl[i + 1];
          const duration = next ? (next.time - cur.time) : 0.1;
          animFrames.push({ region: cur.region, duration: Math.max(duration, 0.033) });
        }
      }

      if (!animFrames.length && seqPrefix) {
        const group = (pack.sequenceGroups ?? []).find((g) => g.prefix === seqPrefix);
        if (group) {
          for (const name of group.frames) animFrames.push({ region: name, duration: 1 / 12 });
        }
      }

      if (!animFrames.length && pack.regions) {
        const names = Object.keys(pack.regions).slice(0, 60);
        for (const name of names) animFrames.push({ region: name, duration: 1 / 12 });
      }

      if (!animFrames.length && pack.frames) {
        for (const f of pack.frames) {
          animFrames.push({ frame: f, duration: 1 / 12 });
        }
      }
    }

    function drawRegionLayer(ctx, img, region, cw, ch) {
      const pad = 8;
      const dw = cw - pad * 2;
      const dh = ch - pad * 2;
      let sw = region.width;
      let sh = region.height;
      let sx = region.x;
      let sy = region.y;

      if (region.rotate) {
        sw = region.height;
        sh = region.width;
      }

      const scale = Math.min(dw / (region.origW || sw), dh / (region.origH || sh), 4);
      const w = (region.origW || sw) * scale;
      const h = (region.origH || sh) * scale;
      const dx = (cw - w) / 2;
      const dy = (ch - h) / 2;

      if (region.rotate) {
        ctx.save();
        ctx.translate(dx + w / 2, dy + h / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.drawImage(img, region.x, region.y, region.height, region.width, -w / 2, -h / 2, w, h);
        ctx.restore();
      } else {
        ctx.drawImage(img, sx, sy, region.width, region.height, dx, dy, w, h);
      }
    }

    function drawRegion(ctx, img, region, cw, ch) {
      ctx.clearRect(0, 0, cw, ch);
      ctx.fillStyle = '#12151c';
      ctx.fillRect(0, 0, cw, ch);
      drawRegionLayer(ctx, img, region, cw, ch);
    }

    function drawAnimFrame() {
      if (!currentAnimPack || !animImage || !animFrames.length) return;
      const f = animFrames[animFrameIdx % animFrames.length];
      const cw = Math.min(640, Math.max(320, currentAnimPack.width ? currentAnimPack.width / 2 : 400));
      const ch = Math.min(480, Math.max(240, currentAnimPack.height ? currentAnimPack.height / 2 : 300));
      animCanvas2d.width = cw;
      animCanvas2d.height = ch;
      animCtx.clearRect(0, 0, cw, ch);
      animCtx.fillStyle = '#12151c';
      animCtx.fillRect(0, 0, cw, ch);

      if (f.frame) {
        const fr = f.frame;
        const scale = Math.min((cw - 16) / fr.width, (ch - 16) / fr.height, 4);
        const w = fr.width * scale;
        const h = fr.height * scale;
        animCtx.drawImage(animImage, fr.x, fr.y, fr.width, fr.height, (cw - w) / 2, (ch - h) / 2, w, h);
      } else if (f.layers?.length) {
        for (const layer of f.layers) {
          const region = currentAnimPack.regions?.[layer.region];
          if (!region) continue;
          animCtx.save();
          animCtx.globalAlpha = layer.alpha ?? 1;
          if (layer.add) animCtx.globalCompositeOperation = 'lighter';
          drawRegionLayer(animCtx, animImage, region, cw, ch);
          animCtx.restore();
        }
      } else if (f.region && currentAnimPack.regions?.[f.region]) {
        drawRegion(animCtx, animImage, currentAnimPack.regions[f.region], cw, ch);
      }

      const status = document.getElementById('anim-status');
      if (status) {
        status.textContent = animPlaying
          ? `播放中 · 帧 ${(animFrameIdx % animFrames.length) + 1}/${animFrames.length}`
          : `帧 ${(animFrameIdx % animFrames.length) + 1}/${animFrames.length}`;
      }
    }

    function animTick() {
      if (!animPlaying || !animFrames.length) return;
      const f = animFrames[animFrameIdx % animFrames.length];
      const fps = parseInt(document.getElementById('anim-fps').value, 10);
      const ms = f.duration ? f.duration * 1000 : (1000 / fps);
      drawAnimFrame();
      animFrameIdx = (animFrameIdx + 1) % animFrames.length;
      animTimer = setTimeout(animTick, ms);
    }

    function startAnimPlayer() {
      if (animMode === 'spine') {
        if (spine37Active) {
          spine37Send({ cmd: 'play' });
          animPlaying = true;
          return;
        }
        if (spinePlayerWidget) {
          spinePlayerWidget.play();
          animPlaying = true;
          return;
        }
        if (!spineInstance) return;
        animPlaying = true;
        spineLastTs = 0;
        cancelAnimationFrame(spineRaf);
        spineRaf = requestAnimationFrame(spineLoop);
        return;
      }
      if (!animFrames.length) rebuildAnimFrames();
      if (!animFrames.length) return;
      animFrameIdx = 0;
      animPlaying = true;
      drawAnimFrame();
      animTimer = setTimeout(animTick, 0);
    }

    // Pause: freeze the current pose but keep the spine loop alive so the
    // canvas keeps repainting (handles resize / stays visible, never black).
    function pauseAnimPlayer() {
      animPlaying = false;
      if (spine37Active) {
        spine37Send({ cmd: 'pause' });
        return;
      }
      if (spinePlayerWidget) {
        spinePlayerWidget.pause();
        return;
      }
      if (animMode !== 'spine' && animTimer) {
        clearTimeout(animTimer);
        animTimer = null;
      }
    }

    function stopAnimPlayer() {
      animPlaying = false;
      if (spine37Active) spine37Send({ cmd: 'pause' });
      if (spinePlayerWidget) {
        try { spinePlayerWidget.pause(); } catch { /* ignore */ }
      }
      if (spineRaf) cancelAnimationFrame(spineRaf);
      spineRaf = null;
      spineLastTs = 0;
      if (animTimer) clearTimeout(animTimer);
      animTimer = null;
    }

    function renderAnimMeta() {
      const p = currentAnimPack;
      if (!p) return;
      const rows = [
        ['名称', p.name],
        ['类型', TYPE_LABELS[p.type] ?? p.type],
        ['Import JSON', `<a href="${p.importUrl}" target="_blank" rel="noopener">${p.importUrl.split('/').slice(-3).join('/')}</a>`],
        ['纹理', p.textureFileName ?? p.textureSrc],
        ['Atlas 尺寸', p.width && p.height ? `${p.width}×${p.height}` : '-'],
        ['Region 数', String(p.regionCount ?? 0)],
        ['Spine 版本', p.spineVersion ?? '-'],
        ['播放器', p._player === 'spine37'
          ? 'Spine Runtime 3.7（专用 iframe）'
          : p._player === 'official'
            ? 'Spine Web Player 3.8（官方）'
            : useSpineRuntime(p) ? 'Spine Runtime 3.8 (WebGL, 内置)' : 'Canvas 序列帧'],
        ['动画列表', (p.animationNames ?? []).join(', ') || '-'],
      ];
      const pageList = Object.values(p.texturePages ?? {});
      if (pageList.length > 1) {
        rows.push(['Atlas 页', pageList.map((x) => x.page).join(', ')]);
      }
      const missing = p.missingAtlasPages ?? p._runtimeMissingPages?.map((name) => ({ page: name }));
      if (missing?.length) {
        rows.push([
          '缺失纹理',
          missing.map((m) => `${m.page ?? m} (${m.width ?? '?'}×${m.height ?? '?'})`).join(', ') +
            ' — HAR 未抓到，火焰/序列特效可能不显示',
        ]);
      }
      if (p.sequenceGroups?.length) {
        rows.push(['序列帧组', p.sequenceGroups.map((g) => `${g.prefix}×${g.count}`).join(', ')]);
      }
      const animName = document.getElementById('anim-clip')?.value;
      const baked = p.bakedFrames?.[animName];
      if (baked?.length) {
        rows.push(['预览帧数', `${baked.length} 帧（含透明度合成）`]);
      }
      document.getElementById('anim-meta').innerHTML = rows.map(([k, v]) =>
        `<dt>${k}</dt><dd>${v}</dd>`).join('');
    }

    // ---------- 位图字体（cc.BitmapFont） ----------

    function updateFontButtonState() {
      const btn = document.getElementById('mode-font-btn');
      const count = fontManifest.length;
      btn.disabled = count === 0;
      btn.title = count === 0
        ? '当前 Tab 未识别到位图字体（仅 Cocos HAR 支持）'
        : `识别到 ${count} 个位图字体`;
      if (count === 0 && viewMode === 'fonts') applyViewMode('textures');
    }

    function updateFontStats() {
      document.getElementById('stats').innerHTML =
        `识别到 <strong>${fontFiltered.length}</strong> / ${fontManifest.length} 个位图字体`;
    }

    function updateFontDlButtons() {
      document.getElementById('font-dl-one').disabled = !currentFont;
      document.getElementById('font-dl-all').disabled = !fontManifest.length;
    }

    function renderFontList() {
      const q = document.getElementById('font-search').value.toLowerCase();
      fontFiltered = fontManifest.filter((f) => !q || f.name.toLowerCase().includes(q));
      const list = document.getElementById('font-list');
      list.innerHTML = '';
      if (!fontFiltered.length) {
        list.innerHTML = '<div class="empty">当前 Tab 未识别到位图字体</div>';
      }
      for (const f of fontFiltered) {
        const el = document.createElement('div');
        el.className = 'anim-item' + (currentFont?.id === f.id ? ' active' : '');
        el.innerHTML =
          `<div class="title">${f.name}</div>` +
          `<div class="sub">${f.glyphCount} 字符 · ${f.fontSize ?? '?'}px` +
          `${f.pngUrl ? '' : ' · 缺贴图'}</div>`;
        el.onclick = () => selectFont(f);
        list.appendChild(el);
      }
      updateFontStats();
      updateFontDlButtons();
      if (!currentFont && fontFiltered.length) selectFont(fontFiltered[0]);
    }

    function defaultSampleText(font) {
      const g = font.glyphs ?? '';
      const digits = [...'0123456789'].filter((c) => g.includes(c)).join('');
      if (digits.length >= 4) {
        return digits + [...'$,.x'].filter((c) => g.includes(c)).join('');
      }
      return g.slice(0, 16);
    }

    async function selectFont(font) {
      currentFont = font;
      renderFontList();
      document.getElementById('font-sample-input').value = defaultSampleText(font);
      fontAtlasImage = null;
      const img = document.getElementById('font-atlas-img');
      if (font.pngUrl) {
        img.src = font.pngUrl;
        img.style.display = '';
        try {
          fontAtlasImage = await loadImageSrc(font.pngUrl);
        } catch {
          fontAtlasImage = null;
        }
      } else {
        img.removeAttribute('src');
        img.style.display = 'none';
      }
      renderFontSample();
      renderFontMeta();
    }

    function renderFontSample() {
      const font = currentFont;
      if (!font) return;
      const canvas = document.getElementById('font-sample-canvas');
      const ctx = canvas.getContext('2d');
      const text = document.getElementById('font-sample-input').value || defaultSampleText(font);
      const defs = font.fontDefDictionary ?? {};
      const lineH = font.commonHeight || font.fontSize || 32;

      const glyphs = [];
      let w = 0;
      let maxH = lineH;
      for (const ch of text) {
        const d = defs[ch.charCodeAt(0)];
        if (!d) continue;
        glyphs.push({ d, x: w });
        w += d.xAdvance ?? d.rect?.width ?? 0;
        maxH = Math.max(maxH, (d.yOffset ?? 0) + (d.rect?.height ?? 0));
      }
      canvas.width = Math.max(60, Math.ceil(w) + 8);
      canvas.height = Math.ceil(maxH) + 12;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!fontAtlasImage) {
        ctx.fillStyle = '#8b93a7';
        ctx.font = '13px sans-serif';
        ctx.fillText('贴图缺失或未加载，无法渲染示例', 4, 20);
        return;
      }
      for (const g of glyphs) {
        const r = g.d.rect;
        if (!r?.width || !r?.height) continue;
        ctx.drawImage(
          fontAtlasImage,
          r.x, r.y, r.width, r.height,
          4 + g.x + (g.d.xOffset ?? 0), 6 + (g.d.yOffset ?? 0), r.width, r.height,
        );
      }
    }

    function renderFontMeta() {
      const f = currentFont;
      if (!f) return;
      const rows = [
        ['名称', f.name],
        ['字号 / 行高', `${f.fontSize ?? '?'} / ${f.commonHeight ?? '?'}`],
        ['字符数', String(f.glyphCount)],
        ['字符集', f.glyphs || '-'],
        ['图集尺寸', `${f.atlasWidth}×${f.atlasHeight}`],
        ['贴图', f.textureFileName ?? (f.pngUrl ? f.pngUrl.split('/').pop() : '未匹配到（HAR 未抓到或识别失败）')],
        ['Import JSON', `<a href="${f.importUrl}" target="_blank" rel="noopener">${f.importUrl.split('/').slice(-3).join('/')}</a>`],
        ['导出文件', `${f.id}.fnt${f.pngUrl ? ` + ${f.id}.png` : ''}（标准 BMFont 格式）`],
      ];
      document.getElementById('font-meta').innerHTML =
        rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    }

    async function downloadFonts(all) {
      const fonts = all ? fontManifest : [currentFont].filter(Boolean);
      if (!fonts.length) return;
      const status = document.getElementById('font-status');
      try {
        status.textContent = '打包中…';
        const entries = [];
        const skipped = [];
        for (const f of fonts) {
          const dir = all ? `${f.id}/` : '';
          entries.push({ name: `${dir}${f.id}.fnt`, data: await fetchBytes(f.fntUrl) });
          if (f.pngUrl) {
            const texName = f.pngUrl.split('/').pop();
            try {
              entries.push({ name: `${dir}${texName}`, data: await fetchBytes(f.pngUrl) });
            } catch {
              skipped.push(texName);
            }
          }
        }
        if (skipped.length) {
          entries.push({ name: 'skipped.json', data: new TextEncoder().encode(JSON.stringify(skipped, null, 2)) });
        }
        const zipName = all
          ? `${(activeTab?.id ?? 'fonts').replace(/[^\w.-]+/g, '_')}_bitmap_fonts.zip`
          : `${fonts[0].id}_font.zip`;
        downloadBlob(makeZip(entries), zipName);
        status.textContent = `完成：${fonts.length} 个字体 → ${zipName}`;
      } catch (err) {
        console.error('Font download failed', err);
        status.textContent = `下载失败：${err.message}`;
      }
    }

    document.getElementById('font-dl-one').onclick = () => downloadFonts(false);
    document.getElementById('font-dl-all').onclick = () => downloadFonts(true);
    document.getElementById('font-search').addEventListener('input', renderFontList);
    document.getElementById('font-sample-input').addEventListener('input', renderFontSample);

    // ---------- Spine → PNG 序列帧导出（浏览器内烘焙 + zip 下载） ----------

    const CRC_TABLE = (() => {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        t[n] = c;
      }
      return t;
    })();

    function crc32(u8) {
      let c = 0xffffffff;
      for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
      return (c ^ 0xffffffff) >>> 0;
    }

    /** Store-only (no compression — PNGs are already compressed) zip writer. */
    function makeZip(entries) {
      const enc = new TextEncoder();
      const parts = [];
      const central = [];
      let offset = 0;
      for (const e of entries) {
        const name = enc.encode(e.name);
        const crc = crc32(e.data);
        const h = new DataView(new ArrayBuffer(30));
        h.setUint32(0, 0x04034b50, true);
        h.setUint16(4, 20, true);
        h.setUint16(6, 0x0800, true); // UTF-8 names
        h.setUint16(8, 0, true); // store
        h.setUint32(14, crc, true);
        h.setUint32(18, e.data.length, true);
        h.setUint32(22, e.data.length, true);
        h.setUint16(26, name.length, true);
        parts.push(new Uint8Array(h.buffer), name, e.data);
        central.push({ name, crc, size: e.data.length, offset });
        offset += 30 + name.length + e.data.length;
      }
      let cdSize = 0;
      for (const c of central) {
        const h = new DataView(new ArrayBuffer(46));
        h.setUint32(0, 0x02014b50, true);
        h.setUint16(4, 20, true);
        h.setUint16(6, 20, true);
        h.setUint16(8, 0x0800, true);
        h.setUint16(10, 0, true);
        h.setUint32(16, c.crc, true);
        h.setUint32(20, c.size, true);
        h.setUint32(24, c.size, true);
        h.setUint16(28, c.name.length, true);
        h.setUint32(42, c.offset, true);
        parts.push(new Uint8Array(h.buffer), c.name);
        cdSize += 46 + c.name.length;
      }
      const eocd = new DataView(new ArrayBuffer(22));
      eocd.setUint32(0, 0x06054b50, true);
      eocd.setUint16(8, central.length, true);
      eocd.setUint16(10, central.length, true);
      eocd.setUint32(12, cdSize, true);
      eocd.setUint32(16, offset, true);
      parts.push(new Uint8Array(eocd.buffer));
      return new Blob(parts, { type: 'application/zip' });
    }

    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    }

    function showBakeProgress(done, total, label) {
      const box = document.getElementById('bake-progress');
      box.style.display = 'flex';
      document.getElementById('bake-fill').style.width =
        total ? `${Math.min(100, Math.round((done / total) * 100))}%` : '0%';
      document.getElementById('bake-text').textContent =
        total ? `${label ?? ''} ${done}/${total}` : label ?? '';
    }

    function hideBakeProgress(finalText) {
      if (finalText) {
        showBakeProgress(1, 1, finalText);
        setTimeout(() => { document.getElementById('bake-progress').style.display = 'none'; }, 2500);
      } else {
        document.getElementById('bake-progress').style.display = 'none';
      }
    }

    const BAKE_BUTTON_IDS = ['anim-bake-one', 'anim-bake-all', 'anim-bake-tab', 'anim-dl-one', 'anim-dl-all'];

    function spineManifestItems() {
      return animationManifest.filter((a) => String(a.type ?? '').startsWith('spine'));
    }

    function updateBakeButtons() {
      if (baking) return;
      const cur = !!currentAnimPack && useSpineRuntime(currentAnimPack) && animMode === 'spine';
      const anyTab = spineManifestItems().length > 0;
      const states = {
        'anim-bake-one': cur,
        'anim-bake-all': cur,
        'anim-dl-one': cur && !!currentAnimPack?.skelUrl,
        'anim-bake-tab': anyTab,
        'anim-dl-all': anyTab,
      };
      for (const [id, ok] of Object.entries(states)) {
        const btn = document.getElementById(id);
        btn.disabled = !ok;
        btn.title = ok ? '' : '仅 Spine 动画支持';
      }
    }

    function setBakeButtonsDisabled(disabled) {
      for (const id of BAKE_BUTTON_IDS) document.getElementById(id).disabled = disabled;
    }

    let baking = false;
    const safeName = (s) => String(s).replace(/[^\w.-]+/g, '_');
    const padFrame = (i) => String(i).padStart(4, '0');

    async function fetchPackForItem(item) {
      if (item === currentAnimItem && currentAnimPack) return currentAnimPack;
      const res = await fetch(item.previewFile);
      if (!res.ok) throw new Error(`${item.previewFile} ${res.status}`);
      return await res.json();
    }

    async function fetchBytes(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${url} ${r.status}`);
      return new Uint8Array(await r.arrayBuffer());
    }

    // Hidden iframe hosting the 3.7 runtime for batch bakes (the preview
    // iframe only holds the currently selected pack).
    let bake37Frame = null;
    async function ensureBake37Host() {
      if (bake37Frame?.contentWindow?.bakeFromUrls) return bake37Frame.contentWindow;
      await new Promise((resolve, reject) => {
        bake37Frame = document.createElement('iframe');
        bake37Frame.style.display = 'none';
        bake37Frame.src = 'spine37-player.html';
        bake37Frame.onload = resolve;
        bake37Frame.onerror = () => reject(new Error('无法加载 3.7 烘焙宿主'));
        document.body.appendChild(bake37Frame);
      });
      if (!bake37Frame.contentWindow?.bakeFromUrls) throw new Error('3.7 烘焙宿主未就绪');
      return bake37Frame.contentWindow;
    }

    /** Bake one pack with the runtime that matches its Spine version. */
    async function bakePack(pack, anims, fps, scale, onProgress) {
      if (isSpine37(pack)) {
        if (pack === currentAnimPack && spine37Active && animPlayer37El.contentWindow?.bakeFrames) {
          return animPlayer37El.contentWindow.bakeFrames({ fps, scale, animations: anims }, onProgress);
        }
        const host = await ensureBake37Host();
        return host.bakeFromUrls(
          { skelUrl: pack.skelUrl, atlasUrl: pack.atlasUrl, fps, scale, animations: anims },
          onProgress,
        );
      }
      const { skeletonJson, atlasText, images } = await loadSpineSource(pack);
      return spineBakeFrames(
        { skeletonJson: normalizeSkeletonJson(skeletonJson), atlasText, images, fps, scale, animations: anims },
        onProgress,
      );
    }

    /** Append one bake result's frames to zip entries; returns per-anim meta. */
    async function appendBakeResult(entries, result, baseDir) {
      const animsMeta = [];
      for (const a of result.animations) {
        if (a.error || !a.frames.length) continue;
        const dir = (baseDir ? baseDir + '/' : '') + safeName(a.name);
        for (let i = 0; i < a.frames.length; i++) {
          entries.push({
            name: `${dir}/frame_${padFrame(i)}.png`,
            data: new Uint8Array(await a.frames[i].arrayBuffer()),
          });
        }
        const { frames, ...info } = a;
        animsMeta.push({ ...info, dir });
      }
      return animsMeta;
    }

    function bakeOpts() {
      return {
        fps: Math.min(60, Math.max(1, parseInt(document.getElementById('bake-fps').value, 10) || 30)),
        scale: parseFloat(document.getElementById('bake-scale').value) || 1,
      };
    }

    async function runBakeJob(fn) {
      if (baking) return;
      baking = true;
      setBakeButtonsDisabled(true);
      try {
        await fn();
      } catch (err) {
        console.error('Bake failed', err);
        hideBakeProgress(`导出失败：${err.message}`);
      } finally {
        baking = false;
        updateBakeButtons();
      }
    }

    function bakeCurrentPack(all) {
      if (!currentAnimPack || animMode !== 'spine') return;
      const pack = currentAnimPack;
      const { fps, scale } = bakeOpts();
      const current = document.getElementById('anim-clip').value;
      const anims = all ? [] : [current].filter(Boolean); // empty = all animations
      runBakeJob(async () => {
        showBakeProgress(0, 0, '加载资源…');
        const result = await bakePack(pack, anims, fps, scale, showBakeProgress);

        showBakeProgress(0, 0, '打包 zip…');
        const entries = [];
        const metaOut = { pack: pack.name, spineVersion: pack.spineVersion ?? null, fps, animations: [] };
        metaOut.animations = await appendBakeResult(entries, result, '');
        if (!entries.length) throw new Error('没有可导出的帧（动画为空或资源缺失）');
        if (result.missingRegions?.length) metaOut.missingRegions = result.missingRegions;
        entries.push({ name: 'meta.json', data: new TextEncoder().encode(JSON.stringify(metaOut, null, 2)) });

        const zipName = all || !current
          ? `${safeName(pack.name)}_frames_${fps}fps.zip`
          : `${safeName(pack.name)}_${safeName(current)}_${fps}fps.zip`;
        downloadBlob(makeZip(entries), zipName);
        const total = metaOut.animations.reduce((s, a) => s + a.frameCount, 0);
        hideBakeProgress(`完成：${metaOut.animations.length} 个动画 · ${total} 帧 → ${zipName}`);
      });
    }

    /** Bake every spine pack in the current tab into one zip. */
    function bakeAllPacks() {
      const items = spineManifestItems();
      if (!items.length) return;
      const { fps, scale } = bakeOpts();
      runBakeJob(async () => {
        const entries = [];
        const metaOut = { tab: activeTab?.id ?? null, fps, packs: [], skipped: [] };
        for (let pi = 0; pi < items.length; pi++) {
          const item = items[pi];
          const label = `[${pi + 1}/${items.length}] ${item.name}`;
          try {
