            showBakeProgress(0, 0, `${label} 加载…`);
            const pack = await fetchPackForItem(item);
            if (!useSpineRuntime(pack) || !pack.skelUrl) {
              metaOut.skipped.push({ name: item.name, reason: '无 Spine 导出文件' });
              continue;
            }
            const result = await bakePack(pack, [], fps, scale, (d, t, l) =>
              showBakeProgress(d, t, `${label} ${l ?? ''}`),
            );
            const packMeta = {
              name: pack.name,
              spineVersion: pack.spineVersion ?? null,
              animations: await appendBakeResult(entries, result, safeName(pack.name)),
            };
            if (result.missingRegions?.length) packMeta.missingRegions = result.missingRegions;
            metaOut.packs.push(packMeta);
          } catch (err) {
            console.warn('bake pack failed:', item.name, err);
            metaOut.skipped.push({ name: item.name, reason: err.message });
          }
        }
        if (!entries.length) throw new Error('没有可导出的帧');
        entries.push({ name: 'meta.json', data: new TextEncoder().encode(JSON.stringify(metaOut, null, 2)) });
        showBakeProgress(0, 0, '打包 zip…');
        const zipName = `${safeName(activeTab?.id ?? 'spine')}_all_frames_${fps}fps.zip`;
        downloadBlob(makeZip(entries), zipName);
        const totalFrames = metaOut.packs.reduce(
          (s, p) => s + p.animations.reduce((s2, a) => s2 + a.frameCount, 0), 0,
        );
        const skip = metaOut.skipped.length ? ` · 跳过 ${metaOut.skipped.length} 个` : '';
        hideBakeProgress(`完成：${metaOut.packs.length} 个 Spine · ${totalFrames} 帧${skip} → ${zipName}`);
      });
    }

    /** Download the original Spine files (skeleton.json / .atlas / pages). */
    function downloadSpinePacks(all) {
      const items = all ? spineManifestItems() : [currentAnimItem].filter(Boolean);
      if (!items.length) return;
      runBakeJob(async () => {
        const entries = [];
        const skipped = [];
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          showBakeProgress(i, items.length, `下载 ${item.name}`);
          try {
            const pack = await fetchPackForItem(item);
            if (!pack.skelUrl || !pack.atlasUrl) {
              skipped.push({ name: item.name, reason: '无 Spine 导出文件' });
              continue;
            }
            const dir = all ? safeName(pack.name) + '/' : '';
            entries.push({ name: `${dir}skeleton.json`, data: await fetchBytes(pack.skelUrl) });
            entries.push({ name: `${dir}skeleton.atlas`, data: await fetchBytes(pack.atlasUrl) });
            for (const [page, url] of Object.entries(pack.pageUrls ?? {})) {
              try {
                entries.push({ name: `${dir}${page}`, data: await fetchBytes(url) });
              } catch {
                skipped.push({ name: `${item.name}/${page}`, reason: '贴图缺失' });
              }
            }
          } catch (err) {
            skipped.push({ name: item.name, reason: err.message });
          }
        }
        if (!entries.length) throw new Error('没有可下载的 Spine 资源');
        if (skipped.length) {
          entries.push({ name: 'skipped.json', data: new TextEncoder().encode(JSON.stringify(skipped, null, 2)) });
        }
        showBakeProgress(items.length, items.length, '打包 zip…');
        const zipName = all
          ? `${safeName(activeTab?.id ?? 'spine')}_spine_packs.zip`
          : `${safeName(items[0].name)}_spine.zip`;
        downloadBlob(makeZip(entries), zipName);
        const skip = skipped.length ? ` · ${skipped.length} 项跳过` : '';
        hideBakeProgress(`完成：${all ? items.length + ' 个 Spine 资源包' : items[0].name}${skip} → ${zipName}`);
      });
    }

    document.getElementById('anim-bake-one').onclick = () => bakeCurrentPack(false);
    document.getElementById('anim-bake-all').onclick = () => bakeCurrentPack(true);
    document.getElementById('anim-bake-tab').onclick = () => bakeAllPacks();
    document.getElementById('anim-dl-one').onclick = () => downloadSpinePacks(false);
    document.getElementById('anim-dl-all').onclick = () => downloadSpinePacks(true);

    document.getElementById('anim-play').onclick = startAnimPlayer;
    document.getElementById('anim-pause').onclick = pauseAnimPlayer;
    document.getElementById('anim-clip').onchange = () => {
      if (animMode === 'spine') {
        spineSetAnimation(document.getElementById('anim-clip').value);
        return;
      }
      rebuildAnimFrames();
      animFrameIdx = 0;
      drawAnimFrame();
    };
    document.getElementById('anim-seq').onchange = () => { rebuildAnimFrames(); animFrameIdx = 0; drawAnimFrame(); };
    document.getElementById('anim-zoom').onchange = (e) => {
      animZoomMode = e.target.value;
      if (spine37Active) spine37Send({ cmd: 'zoom', mode: animZoomMode });
      else if (spinePlayerWidget) applyOfficialZoom();
      // fallback renderer picks up animZoomMode on its next frame via fitSpineCamera
    };
    document.getElementById('anim-fps').oninput = (e) => {
      document.getElementById('anim-fps-val').textContent = e.target.value;
    };
    ['anim-search', 'anim-type-filter'].forEach((id) => {
      document.getElementById(id).addEventListener('input', renderAnimList);
      document.getElementById(id).addEventListener('change', renderAnimList);
    });

    updateAnimButtonState();
    updateFontButtonState();

    ['search', 'cat-filter', 'ext-filter', 'type-filter', 'sort'].forEach((id) => {
      document.getElementById(id).addEventListener('input', applyFilters);
      document.getElementById(id).addEventListener('change', applyFilters);
    });

    (async function boot() {
      try {
        const res = await fetch('catalog.json', { cache: 'no-store' });
        if (res.ok) {
          const cat = await res.json();
          tabs = cat.tabs ?? [];
        }
      } catch { /* no data dir yet — start empty */ }

      renderTabs();
      const first = tabs.find((t) => !t.meta?.missing) ?? tabs[0];
      if (first) {
        activateTab(first);
        if (filtered.length) selectTexture(filtered[0]);
      } else {
        rebuildFilters();
        applyFilters();
        document.getElementById('subtitle').textContent =
          '暂无数据 — 拖拽 .har 文件到页面，或点击「+ 新 HAR」';
      }
    })();
  </script>
</body>
